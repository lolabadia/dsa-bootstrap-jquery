<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<!--    títol-->
    <title>GitHub repositories</title>

    <!-- per importar Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- per importar JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        #search {
            background-color: pink;
            border-color: pink;
            color: black;
        }
    </style>

</head>

<body>
<!--contenidor de bootstrap per organitzar pagina-->
<div class="container mt-5">

    <h1 class="text-center mb-4">GITHUB REPOSITORIES</h1>

    <div class="mb-3">
        <label class="form-label">GitHub username:</label>
        <input type="text" id="username" class="form-control">
    </div>

    <button id="search" class="btn btn-primary">Search</button>

    <table class="table mt-4">
        <thead>
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Followers</th>
        </tr>
        </thead>

<!--        JQuery afegeix repositoris trobats-->
        <tbody id="repositories">
        </tbody>
    </table>

</div>

<!--Conectem HTML amb archiu JavaScript-->
<script src="script.js"></script>

</body>
</html>
